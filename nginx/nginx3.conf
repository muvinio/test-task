events {}

http {
    server {
        listen 172.25.0.4:80;

        location /nginx1/ {
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_pass http://nginx1:8080/;
        }
        location /nginx2/ {
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_pass http://nginx2:8080/;
        }
        location /app/ {
            proxy_set_header X-Forwarded-For "$remote_addr, $server_addr";
            proxy_pass http://app:3000/;
        }
    }

    server {
        listen 172.25.0.4:8080;

        location /nginx1/ {
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://nginx1:8080/;
        }
        location /nginx2/ {
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://nginx2:8080/;
        }
        location /app/ {
            proxy_set_header X-Forwarded-For "$proxy_add_x_forwarded_for, $server_addr";
            proxy_pass http://app:3000/;
        }
    }
}
