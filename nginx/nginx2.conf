events {}

http {
    server {
        listen 80;
        location /nginx1/ {
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_pass http://nginx1:8080/;
        }
        location /nginx3/ {
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_pass http://nginx3:8080/;
        }
        location /app/ {
            proxy_set_header X-Forwarded-For "$remote_addr, $server_addr";
            proxy_pass http://app:3000/;
        }
    }

    server {
        listen 8080;
        location /nginx1/ {
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://nginx1:8080/;
        }
        location /nginx3/ {
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://nginx3:8080/;
        }
        location /app/ {
            proxy_set_header X-Forwarded-For "$proxy_add_x_forwarded_for, $server_addr";
            proxy_pass http://app:3000/;
        }
    }
}